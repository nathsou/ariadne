Ariadne.getField : Ariadne.JSValue → String → Except Ariadne.Fault Ariadne.JSValue :=
  fun x x_1 =>
  match x, x_1 with
  | Ariadne.JSValue.record kvs, f =>
    match List.lookup f kvs with
    | Option.some v => Except.ok v
    | Option.none =>
      if Ariadne.protoNames.contains f = Bool.true then
        Except.error (Ariadne.Fault.unsupported (ToString.toString "prototype property " ++ ToString.toString f))
      else Except.ok Ariadne.JSValue.undefined
  | Ariadne.JSValue.array xs, "length" => Except.ok (Ariadne.JSValue.number ↑xs.length)
  | Ariadne.JSValue.string s, "length" => Except.ok (Ariadne.JSValue.number ↑(List.length s))
  | x, f => Except.error (Ariadne.Fault.unsupported (ToString.toString "property " ++ ToString.toString f))

