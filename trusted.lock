Ariadne.binary : Ariadne.BinOp → Ariadne.JSValue → Ariadne.JSValue → Except Ariadne.Fault Ariadne.JSValue :=
  fun x x_1 x_2 =>
  match x, x_1, x_2 with
  | Ariadne.BinOp.add, Ariadne.JSValue.number a, Ariadne.JSValue.number b => Ariadne.number (a + b)
  | Ariadne.BinOp.add, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b => Except.ok (Ariadne.JSValue.bigint (a + b))
  | Ariadne.BinOp.add, Ariadne.JSValue.string a, Ariadne.JSValue.string b => Except.ok (Ariadne.JSValue.string (a ++ b))
  | Ariadne.BinOp.sub, Ariadne.JSValue.number a, Ariadne.JSValue.number b => Ariadne.number (a - b)
  | Ariadne.BinOp.sub, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b => Except.ok (Ariadne.JSValue.bigint (a - b))
  | Ariadne.BinOp.mul, Ariadne.JSValue.number a, Ariadne.JSValue.number b => Ariadne.number (a * b)
  | Ariadne.BinOp.mul, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b => Except.ok (Ariadne.JSValue.bigint (a * b))
  | Ariadne.BinOp.div, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b =>
    if b = 0 then Except.error (Ariadne.Fault.unsupported "division by zero")
    else Except.ok (Ariadne.JSValue.bigint (a.tdiv b))
  | Ariadne.BinOp.mod, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b =>
    if b = 0 then Except.error (Ariadne.Fault.unsupported "division by zero")
    else Except.ok (Ariadne.JSValue.bigint (a.tmod b))
  | Ariadne.BinOp.div, Ariadne.JSValue.number n, Ariadne.JSValue.number n_1 =>
    Except.error (Ariadne.Fault.unsupported "number division")
  | Ariadne.BinOp.mod, Ariadne.JSValue.number a, Ariadne.JSValue.number b =>
    if b = 0 then Except.error (Ariadne.Fault.unsupported "remainder by zero") else Ariadne.number (a.tmod b)
  | Ariadne.BinOp.floorDiv, Ariadne.JSValue.number a, Ariadne.JSValue.number b =>
    if
        (Decidable.decide (b = 0) || !Decidable.decide (-Ariadne.maxSafe ≤ a ∧ a ≤ Ariadne.maxSafe) ||
            !Decidable.decide (-Ariadne.maxSafe ≤ b ∧ b ≤ Ariadne.maxSafe)) =
          Bool.true then
      Except.error (Ariadne.Fault.unsupported "floor division outside the safe integers")
    else Except.ok (Ariadne.JSValue.number (a.fdiv b))
  | Ariadne.BinOp.eq, a, b => do
    let __do_lift ← Ariadne.strictEq a b
    Pure.pure (Ariadne.JSValue.bool __do_lift)
  | Ariadne.BinOp.ne, a, b => do
    let __do_lift ← Ariadne.strictEq a b
    Pure.pure (Ariadne.JSValue.bool !__do_lift)
  | Ariadne.BinOp.lt, Ariadne.JSValue.number a, Ariadne.JSValue.number b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (a < b)))
  | Ariadne.BinOp.lt, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (a < b)))
  | Ariadne.BinOp.le, Ariadne.JSValue.number a, Ariadne.JSValue.number b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (a ≤ b)))
  | Ariadne.BinOp.le, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (a ≤ b)))
  | Ariadne.BinOp.gt, Ariadne.JSValue.number a, Ariadne.JSValue.number b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (b < a)))
  | Ariadne.BinOp.gt, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (b < a)))
  | Ariadne.BinOp.ge, Ariadne.JSValue.number a, Ariadne.JSValue.number b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (b ≤ a)))
  | Ariadne.BinOp.ge, Ariadne.JSValue.bigint a, Ariadne.JSValue.bigint b =>
    Except.ok (Ariadne.JSValue.bool (Decidable.decide (b ≤ a)))
  | Ariadne.BinOp.lt, Ariadne.JSValue.string a, Ariadne.JSValue.string b =>
    Except.ok (Ariadne.JSValue.bool (Ariadne.strLt a b))
  | Ariadne.BinOp.le, Ariadne.JSValue.string a, Ariadne.JSValue.string b =>
    Except.ok (Ariadne.JSValue.bool (Ariadne.strLe a b))
  | Ariadne.BinOp.gt, Ariadne.JSValue.string a, Ariadne.JSValue.string b =>
    Except.ok (Ariadne.JSValue.bool (Ariadne.strLt b a))
  | Ariadne.BinOp.ge, Ariadne.JSValue.string a, Ariadne.JSValue.string b =>
    Except.ok (Ariadne.JSValue.bool (Ariadne.strLe b a))
  | Ariadne.BinOp.looseEq, a, b =>
    if (a.nullish || b.nullish) = Bool.true then Except.ok (Ariadne.JSValue.bool (a.nullish && b.nullish))
    else Except.error (Ariadne.Fault.unsupported "== without a nullish operand")
  | Ariadne.BinOp.looseNe, a, b =>
    if (a.nullish || b.nullish) = Bool.true then Except.ok (Ariadne.JSValue.bool !(a.nullish && b.nullish))
    else Except.error (Ariadne.Fault.unsupported "!= without a nullish operand")
  | x, x_3, x_4 => Except.error (Ariadne.Fault.typeError "binary operands")

