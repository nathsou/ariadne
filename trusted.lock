Ariadne.consistent : List (List Int) → Bool :=
  fun signs =>
  have ix := List.range signs.length;
  ix.all fun i =>
    ix.all fun j =>
      Ariadne.signAt signs i j == -Ariadne.signAt signs j i &&
        ix.all fun k =>
          (Decidable.decide (Ariadne.signAt signs i j > 0) || Decidable.decide (Ariadne.signAt signs j k > 0) ||
                Decidable.decide (Ariadne.signAt signs i k ≤ 0)) &&
              (Decidable.decide (Ariadne.signAt signs i j ≥ 0) || Decidable.decide (Ariadne.signAt signs j k > 0) ||
                Decidable.decide (Ariadne.signAt signs i k < 0)) &&
            (Decidable.decide (Ariadne.signAt signs i j > 0) || Decidable.decide (Ariadne.signAt signs j k ≥ 0) ||
              Decidable.decide (Ariadne.signAt signs i k < 0))

