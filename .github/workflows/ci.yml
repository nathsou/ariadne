name: Verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-pinned Lean, elan, and Bun
        run: bash scripts/install-ci-tools.sh
      - name: Kernel proofs, regeneration, axiom audit, and native differential tests
        run: scripts/check.sh
