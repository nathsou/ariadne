name: Verify
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # The general theorem, kernel-checked fixtures, the model against JavaScript,
  # differential and negative tests, and the axiom audit.
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-pinned Lean and Bun
        run: bash scripts/install-ci-tools.sh
      # No build cache: Lean imports compiled modules without re-checking their
      # proofs, so every module this run reports as checked is built here.
      - name: Check
        run: scripts/check.sh
