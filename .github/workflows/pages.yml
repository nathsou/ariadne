name: Playground
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Builds the playground (playground/build.sh): the translator compiled to WebAssembly, the examples
  # with their proofs (kernel-checked here), and the static page. Deployed from main only.
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install checksum-pinned Lean and Bun
        run: bash scripts/install-ci-tools.sh
      - name: Install Emscripten 6.0.12
        run: |
          git clone --quiet https://github.com/emscripten-core/emsdk.git "$RUNNER_TEMP/emsdk"
          cd "$RUNNER_TEMP/emsdk"
          git checkout --quiet 35ff8a6d150541276abbc6bae512ca90bcfbe220 # 6.0.12
          ./emsdk install 6.0.12
          ./emsdk activate 6.0.12
          source ./emsdk_env.sh
          echo "$PATH" > "$RUNNER_TEMP/path"
          echo "EMSDK=$EMSDK" >> "$GITHUB_ENV"
          tr ':' '\n' < "$RUNNER_TEMP/path" | grep emsdk >> "$GITHUB_PATH"
      # Lean's runtime and the standard library's C, compiled for WebAssembly: they depend only on the
      # toolchain and Emscripten (wasm/build.sh rebuilds Ariadne's own modules every time).
      - name: Restore the WebAssembly build of Lean's libraries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            playground/.build/lean4-*
            playground/.build/runtime
            playground/.build/stdlib
            playground/.build/obj/Init
            playground/.build/obj/Std
            playground/.build/obj/Lean
          key: lean-wasm-${{ hashFiles('lean-toolchain', 'playground/wasm/build.sh') }}-emsdk-6.0.12
      - name: Build
        run: bash playground/build.sh
      - name: Upload the site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: playground/site/dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
