Quickstart.Ledger.balance : List Quickstart.Ledger.Entry → Int :=
  fun entries =>
  have total := 0;
  Ariadne.forIn entries
    (fun e next2' exit2' x =>
      match x with
      | (total, entries, PUnit.unit) =>
        match e with
        | Sum.inl (e, PUnit.unit) =>
          have total := total + e;
          next2' (total, entries, ())
        | Sum.inr (e, PUnit.unit) =>
          have after6' := fun x =>
            match x with
            | (fst, total, entries, PUnit.unit) => next2' (total, entries, ());
          if Decidable.decide (e ≤ total) = Bool.true then
            have total := total - e;
            after6' (((), e, ()), total, entries, ())
          else after6' (((), e, ()), total, entries, ()))
    (fun x =>
      match x with
      | (total, fst, PUnit.unit) => total)
    (total, entries, ())

Quickstart.Ledger.credit : Quickstart.Ledger.Accounts → Ariadne.JSString → Int → Quickstart.Ledger.Accounts :=
  fun this id amount =>
  if ((Ariadne.mapGet this.frozen id).isSome || Decidable.decide (amount ≤ 0)) = Bool.true then this
  else
    have this :=
      this.withBalances
        (Ariadne.mapPut this.balances id
          ((match Ariadne.mapGet this.balances id with
            | Option.some v' => v'
            | Option.none => 0) +
            amount));
    this

Quickstart.Ledger.freeze : Quickstart.Ledger.Accounts → Ariadne.JSString → Quickstart.Ledger.Accounts :=
  fun this id =>
  have this := this.withFrozen (Ariadne.mapPut this.frozen id Bool.true);
  this

Quickstart.Spec.amount : Quickstart.Ledger.Entry → Int :=
  fun x =>
  match x with
  | Sum.inl (a, PUnit.unit) => a
  | Sum.inr (a, PUnit.unit) => a

Quickstart.Spec.balance_nonneg : Prop :=
  ∀ (entries : List Quickstart.Ledger.Entry),
  (∀ (e : Quickstart.Ledger.Entry), e ∈ entries → 0 ≤ Quickstart.Spec.amount e) → 0 ≤ Quickstart.Ledger.balance entries

Quickstart.Spec.credit_frozen : Prop :=
  ∀ (a : Quickstart.Ledger.Accounts) (id : Ariadne.JSString) (amount : Int),
  (Ariadne.mapGet a.frozen id).isSome = Bool.true → Quickstart.Ledger.credit a id amount = a

Quickstart.Spec.freeze_keeps_balances : Prop :=
  ∀ (a : Quickstart.Ledger.Accounts) (id : Ariadne.JSString), (Quickstart.Ledger.freeze a id).balances = a.balances

Quickstart.Spec.freeze_runs : Prop :=
  ∀ (a : Quickstart.Ledger.Accounts) (id : Ariadne.JSString) (this' : Ariadne.JSValue) (vs : List Ariadne.JSValue),
  Ariadne.ArgsRep Quickstart.Ledger.sig.freeze.params (this' :: vs) (a, id, ()) →
    ∃ w t,
      Ariadne.Converges (fun fuel => Ariadne.runMethod Quickstart.Ledger.ast fuel "freeze" this' vs)
          (Except.ok (w, t)) ∧
        Quickstart.Ledger.ty.Accounts.Rep t (Quickstart.Ledger.freeze a id)

Quickstart.Ledger.Accounts.balances : Quickstart.Ledger.Accounts → List (Ariadne.JSString × Int) :=
  fun r => r.fst

Quickstart.Ledger.Accounts.frozen : Quickstart.Ledger.Accounts → List (Ariadne.JSString × Bool) :=
  fun r => r.snd.fst

Quickstart.Ledger.Accounts.withBalances : Quickstart.Ledger.Accounts → List (Ariadne.JSString × Int) → Quickstart.Ledger.Accounts :=
  fun r v => (v, r.snd)

Quickstart.Ledger.Accounts.withFrozen : Quickstart.Ledger.Accounts → List (Ariadne.JSString × Bool) → Quickstart.Ledger.Accounts :=
  fun r v => (r.fst, v, r.snd.snd)

