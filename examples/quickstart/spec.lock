Quickstart.Ledger.balance.loop : Int → Quickstart.Ledger.Entry → Int :=
  fun total e =>
  have total :=
    match e with
    | Quickstart.Ledger.Entry.credit e =>
      have total := total + e;
      total
    | Quickstart.Ledger.Entry.debit e =>
      have total :=
        if Decidable.decide (e ≤ total) = Bool.true then
          have total := total - e;
          total
        else total;
      total;
  total

